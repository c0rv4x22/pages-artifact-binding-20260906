name: Pages artifact binding test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded test phase
        required: true
        type: choice
        options:
          - produce
          - deploy

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  produce:
    if: ${{ inputs.mode == 'produce' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create inert Pages artifact
        run: |
          mkdir site
          printf '%s\n' 'PAGES_UNTRUSTED_BRANCH_CANARY_20260906' > site/index.html
      - name: Upload inert Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: ${{ inputs.mode == 'deploy' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Select artifact from prior workflow run
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts?name=github-pages&per_page=100" \
            | jq -r '.artifacts[0].id // empty')
          test -n "$artifact_id"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "Selected prior-run artifact ID: $artifact_id"
      - name: Request Pages OIDC token
        id: oidc
        run: |
          oidc=$(curl -fsSL \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fgithub.com%2Fc0rv4x22" \
            | jq -r '.value')
          test -n "$oidc"
          printf '%s' "$oidc" > "$RUNNER_TEMP/pages-oidc-token"
      - name: Submit mismatched artifact deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          oidc=$(cat "$RUNNER_TEMP/pages-oidc-token")
          jq -n \
            --argjson artifact_id "$ARTIFACT_ID" \
            --arg pages_build_version "$GITHUB_SHA" \
            --arg oidc_token "$oidc" \
            '{artifact_id: $artifact_id, pages_build_version: $pages_build_version, oidc_token: $oidc_token}' \
            > "$RUNNER_TEMP/pages-deployment.json"
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/deployments" \
            --data-binary @"$RUNNER_TEMP/pages-deployment.json" \
            | tee "$RUNNER_TEMP/pages-deployment-response.json"
          jq '{status_url, page_url, preview_url}' "$RUNNER_TEMP/pages-deployment-response.json"
